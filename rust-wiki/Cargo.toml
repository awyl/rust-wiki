[package]
name = "rust-wiki"
version = "0.5.2"
edition = "2021"
description = "Remote zosmaai-style wiki MCP server: multi-space vaults, mechanical engine, no LLM"
license = "MIT"

[dependencies]
pulldown-cmark = "0.12"
yaml-rust2 = "0.10"
unicode-normalization = "0.1"
axum = "0.8"
rmcp = { version = "0.3", features = ["server", "transport-streamable-http-server", "transport-worker"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "blocking", "json"] }
html2md = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[lib]
name = "rust_wiki"
path = "src/lib.rs"

[[bin]]
name = "rust-wiki"
path = "src/main.rs"
